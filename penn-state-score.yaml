substitutions:
  device_name: "penn-state-score"
  friendly_name: "Penn State Score"

  # Hardware
  i2s_bclk_pin: GPIO26
  i2s_lrc_pin: GPIO25
  i2s_dout_pin: GPIO22
  button_pin: GPIO33

  # Defaults
  default_song_duration: "62"
  default_volume: "1.00"

  # Replace this with the public URL of your GitLab-hosted JSON file.
  score_json_url: "https://oellig.github.io/penn_state_score/score.json"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

  build_flags:
    - "-DARDUINOJSON_DEFAULT_NESTING_LIMIT=20"

  on_boot:
    priority: -100
    then:
      - delay: 2s
      - media_player.volume_set:
          id: football_player
          volume: ${default_volume}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome
  - platform: web_server

wifi:
  ap:
    ssid: "${friendly_name} Fallback"
    password: "wearepennstate"

captive_portal:

web_server:
  port: 80
  version: 3
  local: true

  sorting_groups:
    - id: score_group
      name: "Live Score"
      sorting_weight: 10

    - id: controls_group
      name: "Controls"
      sorting_weight: 20

    - id: configuration_group
      name: "Configuration"
      sorting_weight: 30

    - id: diagnostics_group
      name: "Diagnostics"
      sorting_weight: 40

# -------------------------------------------------------------------
# SCORE TRACKING STATE
# -------------------------------------------------------------------

globals:
  # Used to establish a baseline on the first successful JSON read.
  # Prevents the device announcing an old score immediately after boot.
  - id: score_initialized
    type: bool
    restore_value: yes
    initial_value: "false"

  - id: last_score
    type: int
    restore_value: yes
    initial_value: "0"

  # Total points (Penn State + opponent) are tracked so the threshold
  # applies to the size of the scoring play, regardless of who scored.
  - id: last_total_score
    type: int
    restore_value: yes
    initial_value: "0"

  # Persist the last handled event so repeated 15-second polls,
  # or a reboot, do not replay the same scoring announcement.
  - id: last_event_id
    type: std::string
    restore_value: yes
    max_restore_data_length: 48
    initial_value: '""'

# -------------------------------------------------------------------
# JSON HTTP CLIENT
# -------------------------------------------------------------------

http_request:
  useragent: "ESPHome Penn State Score Tracker"
  timeout: 10s
  verify_ssl: true

# -------------------------------------------------------------------
# CONFIGURATION
# -------------------------------------------------------------------

number:
  - platform: template
    id: score_threshold
    name: "Automatic Play Threshold"
    icon: "mdi:bullseye-arrow"
    optimistic: true
    restore_value: true
    initial_value: 6
    min_value: 1
    max_value: 14
    step: 1
    unit_of_measurement: "points"
    web_server:
      sorting_group_id: configuration_group

  - platform: template
    id: song_duration
    name: "Song Duration"
    icon: "mdi:timer"
    optimistic: true
    restore_value: true
    initial_value: ${default_song_duration}
    min_value: 1
    max_value: 300
    step: 1
    unit_of_measurement: "s"
    web_server:
      sorting_group_id: configuration_group

  - platform: template
    id: speaker_volume
    name: "Speaker Volume"
    icon: "mdi:volume-high"
    optimistic: true
    restore_value: true
    initial_value: 75
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    web_server:
      sorting_group_id: configuration_group
    set_action:
      - media_player.volume_set:
          id: football_player
          volume: !lambda |-
            return x / 100.0f;

# -------------------------------------------------------------------
# LIVE SCORE DISPLAY
# -------------------------------------------------------------------

sensor:
  - platform: template
    id: team_score
    name: "Team Score"
    icon: "mdi:scoreboard"
    accuracy_decimals: 0
    state_class: measurement
    web_server:
      sorting_group_id: score_group

  - platform: template
    id: opponent_score
    name: "Opponent Score"
    icon: "mdi:scoreboard-outline"
    accuracy_decimals: 0
    state_class: measurement
    web_server:
      sorting_group_id: score_group

  - platform: template
    id: score_difference
    name: "Score Difference"
    icon: "mdi:plus-minus"
    accuracy_decimals: 0
    state_class: measurement
    web_server:
      sorting_group_id: score_group

  - platform: template
    id: previous_score
    name: "Previous Team Score"
    icon: "mdi:history"
    accuracy_decimals: 0
    web_server:
      sorting_group_id: diagnostics_group

  - platform: template
    id: last_score_change
    name: "Last Score Change"
    icon: "mdi:plus"
    accuracy_decimals: 0
    web_server:
      sorting_group_id: diagnostics_group

text_sensor:
  - platform: template
    id: team_name
    name: "Team"
    icon: "mdi:football"
    web_server:
      sorting_group_id: score_group

  - platform: template
    id: opponent_name
    name: "Opponent"
    icon: "mdi:account-group"
    web_server:
      sorting_group_id: score_group

  - platform: template
    id: game_status
    name: "Game Status"
    icon: "mdi:football-helmet"
    web_server:
      sorting_group_id: score_group

  - platform: template
    id: game_period
    name: "Period"
    icon: "mdi:clock-outline"
    web_server:
      sorting_group_id: score_group

  - platform: template
    id: scoring_event
    name: "Scoring Event"
    icon: "mdi:flag"
    web_server:
      sorting_group_id: score_group

  - platform: template
    id: scoring_team
    name: "Scoring Team"
    icon: "mdi:account-voice"
    web_server:
      sorting_group_id: score_group

  - platform: template
    id: current_event_id
    name: "Event ID"
    icon: "mdi:identifier"
    web_server:
      sorting_group_id: diagnostics_group

  - platform: template
    id: last_json_poll
    name: "Last JSON Poll"
    icon: "mdi:cloud-check"
    web_server:
      sorting_group_id: diagnostics_group

# -------------------------------------------------------------------
# I2S / MAX98357A AUDIO
# -------------------------------------------------------------------

i2s_audio:
  - id: i2s_bus
    i2s_bclk_pin: ${i2s_bclk_pin}
    i2s_lrclk_pin: ${i2s_lrc_pin}

speaker:
  # Physical MAX98357A output
  - platform: i2s_audio
    id: max98357_speaker
    i2s_audio_id: i2s_bus
    dac_type: external
    i2s_dout_pin: ${i2s_dout_pin}
    channel: mono
    sample_rate: 48000

  # Mixer combines the media and announcement streams
  - platform: mixer
    id: audio_mixer
    output_speaker: max98357_speaker
    source_speakers:
      - id: media_mixer_input
      - id: announcement_mixer_input
    num_channels: 1

media_player:
  - platform: speaker
    id: football_player
    name: "Football Speaker"

    media_pipeline:
      speaker: media_mixer_input
      num_channels: 1
      format: MP3

    announcement_pipeline:
      speaker: announcement_mixer_input
      num_channels: 1
      format: MP3

    files:
      - id: scoring_song
        file: "sounds/psu.mp3"

    buffer_size: 50000

    volume_initial: 75%
    volume_min: 0%
    volume_max: 100%

# -------------------------------------------------------------------
# AUDIO PLAYBACK
# -------------------------------------------------------------------

script:
  - id: play_scoring_song
    mode: restart
    then:
      - media_player.speaker.play_on_device_media_file:
          id: football_player
          media_file: scoring_song

      - delay: !lambda |-
          return (uint32_t)(
            id(song_duration).state * 1000.0f
          );

      - media_player.stop:
          id: football_player

  # Fetch and parse the published JSON scoreboard.
  - id: fetch_score
    mode: single
    then:
      - http_request.get:
          url: ${score_json_url}
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - if:
                  condition:
                    lambda: |-
                      return response->status_code == 200;
                  then:
                    - lambda: |-
                        bool parsed = json::parse_json(
                          body,
                          [](JsonObject root) -> bool {
                            // Validate the essential fields before
                            // publishing anything to the entities.
                            if (
                              !root["team"].is<const char *>() ||
                              !root["opponent"].is<const char *>() ||
                              !root["status"].is<const char *>() ||
                              !root["penn_state_score"].is<int>() ||
                              !root["opponent_score"].is<int>()
                            ) {
                              ESP_LOGW(
                                "score",
                                "JSON is missing one or more required fields."
                              );
                              return false;
                            }

                            std::string team =
                              root["team"].as<std::string>();
                            std::string opponent =
                              root["opponent"].as<std::string>();
                            std::string status =
                              root["status"].as<std::string>();
                            std::string period =
                              root["period"] | "";
                            std::string event =
                              root["event"] | "NONE";
                            // Event ID is displayed for diagnostics only;
                            // score-based playback does not depend on it.
                            std::string new_event_id =
                              root["event_id"] | "";

                            // Read the scores.
                            int new_team_score =
                              root["penn_state_score"].as<int>();
                            int new_opponent_score =
                              root["opponent_score"].as<int>();
                            int new_difference =
                              root["score_difference"] |
                              (new_team_score - new_opponent_score);

                            // Optional scoring_team may be JSON null.
                            std::string new_scoring_team = "NONE";
                            if (!root["scoring_team"].isNull()) {
                              new_scoring_team =
                                root["scoring_team"].as<std::string>();
                            }

                            // Publish the scoreboard.
                            id(team_name).publish_state(team);
                            id(opponent_name).publish_state(opponent);
                            id(game_status).publish_state(status);
                            id(game_period).publish_state(period);
                            id(team_score).publish_state(new_team_score);
                            id(opponent_score).publish_state(new_opponent_score);
                            id(score_difference).publish_state(new_difference);
                            id(scoring_event).publish_state(event);
                            id(scoring_team).publish_state(new_scoring_team);
                            id(current_event_id).publish_state(new_event_id);

                            // Establish the first score as a baseline.
                            // Do not announce the score already in progress
                            // when the ESP32 first starts or is reset.
                            if (!id(score_initialized)) {
                              id(last_score) = new_team_score;
                              id(score_initialized) = true;
                              id(previous_score).publish_state(new_team_score);
                              id(last_score_change).publish_state(0);

                              ESP_LOGI(
                                "score",
                                "Initial score baseline: %s %d, %s %d",
                                team.c_str(),
                                new_team_score,
                                opponent.c_str(),
                                new_opponent_score
                              );
                            } else {
                              // Compare Penn State's current score with the
                              // previously stored Penn State score. The
                              // threshold alone controls automatic playback.
                              int delta = new_team_score - id(last_score);

                              if (delta != 0) {
                                id(previous_score).publish_state(
                                  id(last_score)
                                );
                                id(last_score_change).publish_state(delta);
                              }

                              if (delta >= (int) id(score_threshold).state) {
                                ESP_LOGI(
                                  "score",
                                  "Penn State score increased by %d points; threshold is %d. Playing song.",
                                  delta,
                                  (int) id(score_threshold).state
                                );
                                id(play_scoring_song).execute();
                              } else if (delta > 0) {
                                ESP_LOGI(
                                  "score",
                                  "Penn State score increased by %d points; below playback threshold %d.",
                                  delta,
                                  (int) id(score_threshold).state
                                );
                              } else if (delta < 0) {
                                ESP_LOGW(
                                  "score",
                                  "Penn State score decreased by %d; updating baseline without playback.",
                                  -delta
                                );
                              }

                              // Always store the latest score so the next
                              // poll compares against this value, not an old one.
                              id(last_score) = new_team_score;
                            }

                            id(last_json_poll).publish_state("Success");

                            ESP_LOGI(
                              "score",
                              "%s vs %s: %d - %d, %s",
                              team.c_str(),
                              opponent.c_str(),
                              new_team_score,
                              new_opponent_score,
                              period.c_str()
                            );

                            return true;
                          }
                        );

                        if (!parsed) {
                          ESP_LOGW("score", "Could not parse scoreboard JSON.");
                        }
                  else:
                    - lambda: |-
                        ESP_LOGW(
                          "score",
                          "HTTP request returned status %d",
                          response->status_code
                        );
          on_error:
            then:
              - lambda: |-
                  ESP_LOGW("score", "Unable to retrieve scoreboard JSON.");
                  id(last_json_poll).publish_state("Failed");

# -------------------------------------------------------------------
# PHYSICAL BUTTON
# -------------------------------------------------------------------

binary_sensor:
  - platform: gpio
    id: physical_button
    name: "Physical Button"
    pin:
      number: ${button_pin}
      mode:
        input: true
        pullup: true
      inverted: true

    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms

    on_press:
      then:
        - if:
            condition:
              media_player.is_playing:
                id: football_player
            then:
              - script.stop: play_scoring_song
              - media_player.stop:
                  id: football_player
            else:
              - script.execute: play_scoring_song

    web_server:
      sorting_group_id: controls_group

# -------------------------------------------------------------------
# WEB BUTTONS
# -------------------------------------------------------------------

button:
  - platform: template
    name: "Play Song"
    icon: "mdi:play"
    on_press:
      - script.execute: play_scoring_song
    web_server:
      sorting_group_id: controls_group

  - platform: template
    name: "Stop Song"
    icon: "mdi:stop"
    on_press:
      - script.stop: play_scoring_song
      - media_player.stop:
          id: football_player
    web_server:
      sorting_group_id: controls_group

  - platform: template
    name: "Fetch Score Now"
    icon: "mdi:refresh"
    on_press:
      - script.execute: fetch_score
    web_server:
      sorting_group_id: controls_group

  - platform: template
    name: "Reset Score Tracking"
    icon: "mdi:restart"
    on_press:
      - lambda: |-
          id(score_initialized) = false;
          id(last_score) = 0;

          id(previous_score).publish_state(0);
          id(last_score_change).publish_state(0);

          ESP_LOGI("score", "Score tracking reset.");
    web_server:
      sorting_group_id: diagnostics_group

  - platform: restart
    name: "Restart Device"
    icon: "mdi:restart-alert"
    web_server:
      sorting_group_id: diagnostics_group

# -------------------------------------------------------------------
# AUTOMATIC JSON POLLING
# -------------------------------------------------------------------

interval:
  - interval: 15s
    then:
      - script.execute: fetch_score
